<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>trip_mapper · region</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/region-reel/styles.css" />
  </head>
  <body>
    <div id="stage">
      <div id="map"></div>
      <div id="photo-layer">
        <div id="photo-current"></div>
        <div id="photo-fallback"></div>
      </div>
      <div id="flash"></div>
      <div id="hud">
        <div id="hud-region"></div>
        <div id="hud-stop"></div>
      </div>
      <div id="grain"></div>
      <div id="controls">
        <button id="play">▶ Play</button>
        <button id="restart">⟲ Restart</button>
        <input id="scrub" type="range" min="0" max="1000" value="0" />
        <span id="time"></span>
      </div>
    </div>
    <script type="module" src="/src/region-reel/main.js"></script>
  </body>
</html>
